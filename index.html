<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الدعم العلمي AI | Be First</title>
<meta name="theme-color" content="#050505">
<link rel="icon" href="img/logo-white.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=9">
<link rel="stylesheet" href="chatFormatter.css?v=9">
</head>
<body>

<!-- ── شاشة اختيار المدرس ───────────────────────────── -->
<main id="home" class="home">
  <header class="home-top">
    <img src="img/logo-white.svg" alt="Be First" class="logo">
    <span class="tab-title">الدعم العلمي AI</span>
  </header>

  <section class="intro">
    <h1>اسأل مدرسك في أي وقت</h1>
    <p>اكتب سؤالك أو صوّره، وهيشرحهولك خطوة بخطوة بنفس أسلوبه في الشرح.</p>
  </section>

  <section class="teachers" aria-label="اختار المدرس">
    <!-- بيتملوا من app.js -->
  </section>
</main>

<!-- ── شاشة المحادثة ─────────────────────────────────── -->
<section id="chat" class="chat" hidden>
  <header class="chat-top">
    <button class="icon-btn back" id="backBtn" aria-label="رجوع">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <div class="who">
      <img id="chatAvatar" class="avatar" alt="">
      <div>
        <div id="chatName" class="who-name"></div>
        <div id="chatSubject" class="who-sub"></div>
      </div>
    </div>
    <button class="icon-btn" id="historyBtn" aria-label="المحادثات السابقة" title="المحادثات السابقة">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3 4.5V9h4.5"/><path d="M12 7.5V12l3 2"/></svg>
      <span class="badge" id="historyCount" hidden></span>
    </button>
    <button class="icon-btn" id="newChatBtn" aria-label="محادثة جديدة" title="محادثة جديدة">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </header>

  <div id="messages" class="messages" aria-live="polite"></div>
  <button class="to-bottom" id="toBottom" hidden aria-label="انزل لآخر رسالة">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
  </button>

  <form id="composer" class="composer" autocomplete="off">
    <div id="preview" class="preview" hidden>
      <img id="previewImg" alt="الصورة المرفقة">
      <button type="button" class="preview-x" id="removeImg" aria-label="شيل الصورة">×</button>
    </div>
    <div class="composer-row">
      <button type="button" class="icon-btn" id="cameraBtn" aria-label="صوّر السؤال بالكاميرا">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      </button>
      <label class="icon-btn" aria-label="اختار صورة من المعرض">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M5 17l4.5-4.5 3 3L15 13l4 4"/></svg>
        <input id="fileInput" type="file" accept="image/*" hidden>
      </label>
      <!-- بديل لو الكاميرا جوه الصفحة مش متاحة: بيفتح كاميرا الموبايل نفسها -->
      <input id="captureInput" type="file" accept="image/*" capture="environment" hidden>
      <textarea id="input" rows="1" placeholder="اكتب سؤالك هنا…" aria-label="سؤالك"></textarea>
      <button class="send" id="sendBtn" type="submit" aria-label="ابعت">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12L4 4l3 8-3 8z"/></svg>
      </button>
    </div>
  </form>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" aria-label="المحادثات السابقة" aria-hidden="true">
    <div class="drawer-top">
      <div>
        <div class="drawer-title">محادثاتك</div>
        <div class="who-sub" id="drawerSub"></div>
      </div>
      <button class="icon-btn" id="drawerClose" aria-label="إغلاق">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <button class="new-chat" id="drawerNew">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      محادثة جديدة
    </button>
    <div class="history" id="historyList"></div>
  </aside>
</section>

<!-- ── الكاميرا (نفس فكرة CameraModal في المنصة) ───────── -->
<div id="camera" class="camera" hidden role="dialog" aria-label="تصوير السؤال">
  <video id="cameraVideo" autoplay playsinline muted></video>
  <div class="camera-hint">خلي السؤال كله جوه الكادر وواضح</div>
  <div class="camera-controls">
    <button type="button" class="cam-btn" id="cameraClose" aria-label="إغلاق">✕</button>
    <button type="button" class="shutter" id="cameraShot" aria-label="صوّر"></button>
    <button type="button" class="cam-btn" id="cameraSwitch" aria-label="اقلب الكاميرا">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9a8 8 0 0 1 14-3l2 2M20 15a8 8 0 0 1-14 3l-2-2"/><path d="M20 4v4h-4M4 20v-4h4"/></svg>
    </button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="formatMessage.js?v=9"></script>
<script src="enhanceMessage.js?v=9"></script>
<script src="app.js?v=9"></script>
</body>
</html>
