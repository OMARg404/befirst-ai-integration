<!doctype html>
<!--
  أبسط ربط (الطريقة أ-2 في README): الصفحة جوه iframe، وبيانات الطالب بتتبعت بـ postMessage
  بدل الرابط — عشان ماتبانش في الـ URL. افتحوا الملف ده في المتصفح وجربوه.
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تجربة ربط الدعم العلمي AI</title>
<style>html, body { margin: 0; height: 100%; background: #050505; } iframe { width: 100%; height: 100%; border: 0; display: block; }</style>
</head>
<body>
<iframe id="ai" src="https://aiservice.magacademy.co/befirst-ai/" allow="camera; clipboard-write" title="الدعم العلمي AI"></iframe>
<script>
  // 🔌 بيانات الطالب اللي عامل login عندكم
  const student = { student_id: "48213", student_name: "محمد علي", grade_name: "2 ثانوي | بكالوريا" };

  const frame = document.getElementById("ai");
  frame.addEventListener("load", () => {
    frame.contentWindow.postMessage({ type: "befirst-ai:student", ...student }, "https://aiservice.magacademy.co");
  });
</script>
</body>
</html>
